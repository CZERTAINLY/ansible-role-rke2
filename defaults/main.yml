---
# defaults file for rke2

ansible_python_interpreter: /usr/bin/python3
rke2_certmanager_helm_repository_name: jetstack
rke2_certmanager_helm_repository_url: https://charts.jetstack.io

# Role level fallbacks, used when /etc/ilm-ansible/vars/rke2.yml doesn't set
# the matching key of the 'rke2' dict. vars/main.yml combines the two.

# Which cert-manager release Helm installs into the cluster.
rke2_default_certmanager_version: v1.21.1
# Which local-path-provisioner release provides the default storage class.
rke2_default_local_path_provisioner_version: v0.0.36

# Passed to the installer as INSTALL_RKE2_CHANNEL. Accepts 'stable',
# 'latest', 'testing' or a minor release channel such as 'v1.32'. See
# https://update.rke2.io/v1-release/channels
rke2_default_channel: stable
# Passed to the installer as INSTALL_RKE2_VERSION, e.g. v1.32.5+rke2r1.
# Takes precedence over the channel. Empty means "resolve the channel".
rke2_default_version: ""
# By default the role installs RKE2 only once and never upgrades it. Set
# this to true to let it upgrade an installed RKE2 in place, which stops and
# starts the Kubernetes cluster. Only an exact rke2_default_version /
# rke2.version can be upgraded to, a channel is resolved by the installer
# and there is nothing to compare it with.
rke2_allow_upgrade: false
