---
# pod_name is an extended regular expression, not a plain string, so a
# caller which doesn't know the exact name of the pod can wait for any
# one of several alternatives, e.g. "rke2-traefik|rke2-ingress-nginx-controller".
# It has to stay quoted in the command below, otherwise the shell would
# take the '|' of such an alternation for a pipe.
- name: "Wait untill {{ pod_name | default('') }} in {{ k8s_namespace }} is Running (max 10min, delay=5s)" # noqa name[template]
  ansible.builtin.shell:
    cmd: |
      test `/var/lib/rancher/rke2/bin/kubectl -n {{ k8s_namespace }} get pod |grep -Ei '{{ pod_name }}' | grep Running | wc -l` -ge 1
    executable: /bin/bash
  register: prq
  until: prq.rc == 0
  retries: 120 # 10*60/5
  delay: 5
  changed_when: false
  when: pod_name is defined

- name: "Wait untill all pods in namespace {{ k8s_namespace }} are Running (max 10min, delay=5s)" # noqa name[template]
  ansible.builtin.shell:
    cmd: |
      /var/lib/rancher/rke2/bin/kubectl -n {{ k8s_namespace }} get pod -o json |jq '.items[].status.phase' |
      grep -v Succeeded | sort -u
    executable: /bin/bash
  register: prq
  until: prq.stdout == '"Running"'
  retries: 120
  delay: 5
  changed_when: false
  when: not pod_name is defined
